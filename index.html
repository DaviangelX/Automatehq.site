<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrojo
</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; width: 100%; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #87ceeb 0%, #add8e6 50%, #b0e0e6 100%);
    font-family: Arial, sans-serif;
    position: relative;
  }

  h1 {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(1.5rem, 5vmin, 3rem);
    color: #ff2d55;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    z-index: 10;
  }

  :root {
    --heart-size: clamp(120px, 40vmin, 420px);
    --heart-color: #ff2d55;
  }

  .heart {
    position: relative;
    width: var(--heart-size);
    height: var(--heart-size);
    background: var(--heart-color);
    transform: rotate(-45deg);
    animation: beat 1.4s ease-in-out infinite;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--heart-color);
    border-radius: 50%;
  }

  /* Curvas superiores */
  .heart::before { top: -50%; left: 0; }
  .heart::after  { left: 50%; top: 0; }

  @keyframes beat {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    25%      { transform: rotate(-45deg) scale(1.06); }
    50%      { transform: rotate(-45deg) scale(1); }
    75%      { transform: rotate(-45deg) scale(1.08); }
  }

  @media (prefers-reduced-motion: reduce) {
    .heart { animation: none; }
  }
</style>
</head>
<body>
<h1>oeai iiia</h1>
<div class="heart"></div>
</body>
</html>
